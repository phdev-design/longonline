            if (-not $p.WaitForExit(120000)) { $p.Kill(); "TIMEOUT" }
            "==== $label : probe ===="
            Get-Content $log -Encoding UTF8 -ErrorAction SilentlyContinue | Select-String -Pattern '^PROBE|^    0'
            Get-Content "probe-$label-err.log" -ErrorAction SilentlyContinue | Select-String -Pattern 'SCRIPT ERROR|Parse Error'
          }
          $list = New-WinUserLanguageList en-US
          $list.Add('zh-Hant-HK')
          $list[1].InputMethodTips.Clear()
          $list[1].InputMethodTips.Add('0404:{531FDEBF-9B4C-4A43-A2AA-960E8FCDC732}{6024B45F-5C54-11D4-B921-0080C882687E}')
          $list[1].InputMethodTips.Add('0404:{531FDEBF-9B4C-4A43-A2AA-960E8FCDC732}{4BDF9F03-C7D3-11D4-B2AB-0080C882687E}')
          Set-WinUserLanguageList $list -Force
          Start-Sleep -Seconds 3
          Probe 'hk-two'
      - name: Taiwan Bopomofo and Hong Kong Quick
        if: always()
        shell: powershell
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          function Probe($label) {
            "==== $label : language list ===="
            Get-WinUserLanguageList | ForEach-Object { "$($_.LanguageTag) : $($_.InputMethodTips -join ' ; ')" }
            $godot = (Get-ChildItem godot -Filter 'Godot_v4.7.2-stable_win64.exe').FullName
            $log = "probe-$label.log"
            $p = Start-Process $godot -ArgumentList @('--path', 'proj', '--rendering-driver', 'opengl3', '--script', 'tools/probe_input_method.gd', '--', '--switch') -RedirectStandardOutput $log -RedirectStandardError "probe-$label-err.log" -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); "TIMEOUT" }
            "==== $label : probe ===="
            Get-Content $log -Encoding UTF8 -ErrorAction SilentlyContinue | Select-String -Pattern '^PROBE|^    0'
            Get-Content "probe-$label-err.log" -ErrorAction SilentlyContinue | Select-String -Pattern 'SCRIPT ERROR|Parse Error'
          }
          $list = New-WinUserLanguageList en-US
          $list.Add('zh-Hant-TW')
          $list.Add('zh-Hant-HK')
          Set-WinUserLanguageList $list -Force
          Start-Sleep -Seconds 3
          Probe 'tw-hk'
      - name: Taiwan Bopomofo and Simplified Pinyin
        if: always()
        shell: powershell
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          function Probe($label) {
            "==== $label : language list ===="
            Get-WinUserLanguageList | ForEach-Object { "$($_.LanguageTag) : $($_.InputMethodTips -join ' ; ')" }
            $godot = (Get-ChildItem godot -Filter 'Godot_v4.7.2-stable_win64.exe').FullName
            $log = "probe-$label.log"
            $p = Start-Process $godot -ArgumentList @('--path', 'proj', '--rendering-driver', 'opengl3', '--script', 'tools/probe_input_method.gd', '--', '--switch') -RedirectStandardOutput $log -RedirectStandardError "probe-$label-err.log" -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); "TIMEOUT" }
            "==== $label : probe ===="
            Get-Content $log -Encoding UTF8 -ErrorAction SilentlyContinue | Select-String -Pattern '^PROBE|^    0'
            Get-Content "probe-$label-err.log" -ErrorAction SilentlyContinue | Select-String -Pattern 'SCRIPT ERROR|Parse Error'
          }
          $list = New-WinUserLanguageList en-US
          $list.Add('zh-Hant-TW')
          $list.Add('zh-Hans-CN')
          Set-WinUserLanguageList $list -Force
          Start-Sleep -Seconds 3
          Probe 'tw-cn'
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: input-method-probe
          path: |
            *.log
