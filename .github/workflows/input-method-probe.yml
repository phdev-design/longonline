name: Input method probe
run-name: Input method probe (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Fetch Godot 4.7.2 and write the probe project
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release download 4.7.2-stable --repo godotengine/godot-builds --pattern 'Godot_v4.7.2-stable_win64.exe.zip' --dir godot
          if($LASTEXITCODE -ne 0){throw 'Godot download failed'}
          Expand-Archive godot/Godot_v4.7.2-stable_win64.exe.zip -DestinationPath godot
          Get-ChildItem godot | Select-Object Name, Length
          New-Item -ItemType Directory -Force proj/scripts, proj/tools | Out-Null
          $files=@{
            'proj/project.godot'='Y29uZmlnX3ZlcnNpb249NQoKW2FwcGxpY2F0aW9uXQoKY29uZmlnL25hbWU9ImlucHV0LW1ldGhvZC1wcm9iZSIKCltyZW5kZXJpbmddCgpyZW5kZXJlci9yZW5kZXJpbmdfbWV0aG9kPSJnbF9jb21wYXRpYmlsaXR5Igo='
            'proj/scripts/input_method.gd'=''
            'proj/tools/probe_input_method.gd'=''
            'proj/tools/verify_input_method.gd'=''
          }
          foreach($name in $files.Keys){ [IO.File]::WriteAllBytes((Join-Path $PWD $name), [Convert]::FromBase64String($files[$name])) }
          Get-ChildItem proj -Recurse -File | Select-Object FullName, Length
          [Environment]::OSVersion.VersionString
      - name: Headless checks on Windows (runs the real reg.exe scan)
        if: always()
        shell: pwsh
        run: |
          $godot=(Get-ChildItem godot -Filter 'Godot_v4.7.2-stable_win64.exe').FullName
          $p=Start-Process $godot -ArgumentList @('--headless','--path','proj','--script','tools/verify_input_method.gd') -RedirectStandardOutput verify.log -RedirectStandardError verify-err.log -PassThru
          if(-not $p.WaitForExit(120000)){ $p.Kill(); 'TIMEOUT' }
          Get-Content verify.log | Select-String -Pattern 'FAIL|VERIFY_INPUT_METHOD|scan|Windows tips|description'
          Get-Content verify-err.log | Select-Object -Last 25
          "exit $($p.ExitCode)"
      - name: Probe with the runner's own languages
        if: always()
        shell: powershell
        run: |
          function Probe($label) {
            "==== $label : language list ===="
            Get-WinUserLanguageList | ForEach-Object { "$($_.LanguageTag) : $($_.InputMethodTips -join ' ; ')" }
            "==== $label : registry ===="
            reg query "HKCU\Control Panel\International\User Profile" /s
            $godot = (Get-ChildItem godot -Filter 'Godot_v4.7.2-stable_win64.exe').FullName
            foreach ($driver in @('opengl3', 'opengl3_angle', 'd3d12')) {
              $log = "probe-$label-$driver.log"
              $p = Start-Process $godot -ArgumentList @('--path', 'proj', '--rendering-driver', $driver, '--script', 'tools/probe_input_method.gd', '--', '--switch') -RedirectStandardOutput $log -RedirectStandardError "probe-$label-$driver-err.log" -PassThru
              if (-not $p.WaitForExit(120000)) { $p.Kill(); "TIMEOUT with $driver" }
              "==== $label : probe ($driver) exit $($p.ExitCode) ===="
              Get-Content $log -ErrorAction SilentlyContinue
              Get-Content "probe-$label-$driver-err.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
              if ((Get-Content $log -Raw -ErrorAction SilentlyContinue) -match 'PROBE_DONE') { break }
            }
          }
          Probe 'default'
      - name: Probe with Hong Kong Quick
        if: always()
        shell: powershell
        run: |
          function Probe($label) {
            "==== $label : language list ===="
            Get-WinUserLanguageList | ForEach-Object { "$($_.LanguageTag) : $($_.InputMethodTips -join ' ; ')" }
            "==== $label : registry ===="
            reg query "HKCU\Control Panel\International\User Profile" /s
            $godot = (Get-ChildItem godot -Filter 'Godot_v4.7.2-stable_win64.exe').FullName
            foreach ($driver in @('opengl3', 'opengl3_angle', 'd3d12')) {
              $log = "probe-$label-$driver.log"
              $p = Start-Process $godot -ArgumentList @('--path', 'proj', '--rendering-driver', $driver, '--script', 'tools/probe_input_method.gd', '--', '--switch') -RedirectStandardOutput $log -RedirectStandardError "probe-$label-$driver-err.log" -PassThru
              if (-not $p.WaitForExit(120000)) { $p.Kill(); "TIMEOUT with $driver" }
              "==== $label : probe ($driver) exit $($p.ExitCode) ===="
              Get-Content $log -ErrorAction SilentlyContinue
              Get-Content "probe-$label-$driver-err.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
              if ((Get-Content $log -Raw -ErrorAction SilentlyContinue) -match 'PROBE_DONE') { break }
            }
          }
          $list = New-WinUserLanguageList en-US
          $list.Add('zh-Hant-HK')
          Set-WinUserLanguageList $list -Force
          Start-Sleep -Seconds 3
          Probe 'hk-quick'
      - name: Probe with Hong Kong Quick and Changjie
        if: always()
        shell: powershell
        run: |
          function Probe($label) {
            "==== $label : language list ===="
            Get-WinUserLanguageList | ForEach-Object { "$($_.LanguageTag) : $($_.InputMethodTips -join ' ; ')" }
            "==== $label : registry ===="
            reg query "HKCU\Control Panel\International\User Profile" /s
            $godot = (Get-ChildItem godot -Filter 'Godot_v4.7.2-stable_win64.exe').FullName
            foreach ($driver in @('opengl3', 'opengl3_angle', 'd3d12')) {
              $log = "probe-$label-$driver.log"
              $p = Start-Process $godot -ArgumentList @('--path', 'proj', '--rendering-driver', $driver, '--script', 'tools/probe_input_method.gd', '--', '--switch') -RedirectStandardOutput $log -RedirectStandardError "probe-$label-$driver-err.log" -PassThru
              if (-not $p.WaitForExit(120000)) { $p.Kill(); "TIMEOUT with $driver" }
              "==== $label : probe ($driver) exit $($p.ExitCode) ===="
              Get-Content $log -ErrorAction SilentlyContinue
              Get-Content "probe-$label-$driver-err.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
              if ((Get-Content $log -Raw -ErrorAction SilentlyContinue) -match 'PROBE_DONE') { break }
            }
          }
          $list = New-WinUserLanguageList en-US
          $list.Add('zh-Hant-HK')
          $list[1].InputMethodTips.Clear()
          $list[1].InputMethodTips.Add('0C04:{531FDEBF-9B4C-4A43-A2AA-960E8FCDC732}{6024B45F-5C54-11D4-B921-0080C882687E}')
          $list[1].InputMethodTips.Add('0C04:{531FDEBF-9B4C-4A43-A2AA-960E8FCDC732}{4BDF9F03-C7D3-11D4-B2AB-0080C882687E}')
          Set-WinUserLanguageList $list -Force
          Start-Sleep -Seconds 3
          Probe 'hk-two'
      - name: Probe with Taiwan Bopomofo and Hong Kong Changjie
        if: always()
        shell: powershell
        run: |
          function Probe($label) {
            "==== $label : language list ===="
            Get-WinUserLanguageList | ForEach-Object { "$($_.LanguageTag) : $($_.InputMethodTips -join ' ; ')" }
            "==== $label : registry ===="
            reg query "HKCU\Control Panel\International\User Profile" /s
            $godot = (Get-ChildItem godot -Filter 'Godot_v4.7.2-stable_win64.exe').FullName
            foreach ($driver in @('opengl3', 'opengl3_angle', 'd3d12')) {
              $log = "probe-$label-$driver.log"
              $p = Start-Process $godot -ArgumentList @('--path', 'proj', '--rendering-driver', $driver, '--script', 'tools/probe_input_method.gd', '--', '--switch') -RedirectStandardOutput $log -RedirectStandardError "probe-$label-$driver-err.log" -PassThru
              if (-not $p.WaitForExit(120000)) { $p.Kill(); "TIMEOUT with $driver" }
              "==== $label : probe ($driver) exit $($p.ExitCode) ===="
              Get-Content $log -ErrorAction SilentlyContinue
              Get-Content "probe-$label-$driver-err.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
              if ((Get-Content $log -Raw -ErrorAction SilentlyContinue) -match 'PROBE_DONE') { break }
            }
          }
          $list = New-WinUserLanguageList en-US
          $list.Add('zh-Hant-TW')
          $list.Add('zh-Hant-HK')
          $list[2].InputMethodTips.Clear()
          $list[2].InputMethodTips.Add('0C04:{531FDEBF-9B4C-4A43-A2AA-960E8FCDC732}{4BDF9F03-C7D3-11D4-B2AB-0080C882687E}')
          Set-WinUserLanguageList $list -Force
          Start-Sleep -Seconds 3
          Probe 'tw-hk'
      - name: Probe with Simplified Pinyin only
        if: always()
        shell: powershell
        run: |
          function Probe($label) {
            "==== $label : language list ===="
            Get-WinUserLanguageList | ForEach-Object { "$($_.LanguageTag) : $($_.InputMethodTips -join ' ; ')" }
            "==== $label : registry ===="
            reg query "HKCU\Control Panel\International\User Profile" /s
            $godot = (Get-ChildItem godot -Filter 'Godot_v4.7.2-stable_win64.exe').FullName
            foreach ($driver in @('opengl3', 'opengl3_angle', 'd3d12')) {
              $log = "probe-$label-$driver.log"
              $p = Start-Process $godot -ArgumentList @('--path', 'proj', '--rendering-driver', $driver, '--script', 'tools/probe_input_method.gd', '--', '--switch') -RedirectStandardOutput $log -RedirectStandardError "probe-$label-$driver-err.log" -PassThru
              if (-not $p.WaitForExit(120000)) { $p.Kill(); "TIMEOUT with $driver" }
              "==== $label : probe ($driver) exit $($p.ExitCode) ===="
              Get-Content $log -ErrorAction SilentlyContinue
              Get-Content "probe-$label-$driver-err.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
              if ((Get-Content $log -Raw -ErrorAction SilentlyContinue) -match 'PROBE_DONE') { break }
            }
          }
          $list = New-WinUserLanguageList zh-Hans-CN
          Set-WinUserLanguageList $list -Force
          Start-Sleep -Seconds 3
          Probe 'cn-only'
      - name: Reference registry dumps
        if: always()
        shell: powershell
        run: |
          reg query "HKLM\SOFTWARE\Microsoft\CTF\TIP\{531FDEBF-9B4C-4A43-A2AA-960E8FCDC732}\LanguageProfile" /s
          reg query "HKLM\SOFTWARE\Microsoft\CTF\TIP\{81D4E9C9-1D3B-41BC-9E6C-4B40BF79E35E}\LanguageProfile" /s
          reg query "HKCU\Software\Microsoft\CTF\SortOrder" /s
          reg query "HKCU\Keyboard Layout\Preload"
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: input-method-probe
          path: |
            *.log
