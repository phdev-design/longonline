name: Desktop Windows QA
run-name: Desktop Windows QA ${{ inputs.version }} ${{ inputs.installer_sha256 }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric version of the draft release
        required: true
      installer_sha256:
        description: SHA-256 of the frozen Windows installer
        required: true
permissions:
  # GitHub restricts draft releases to identities with push access.
  contents: write
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
      GULONG_LAUNCHER_VERIFY_ONLY: '1'
    steps:
      - name: Download and verify draft artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $v=$env:RELEASE_VERSION
          if($v -notmatch '^\d+\.\d+\.\d+$'){throw 'Invalid version'}
          New-Item -ItemType Directory assets | Out-Null
          gh release download "v$v" --repo $env:GITHUB_REPOSITORY --dir assets --pattern 'LongOnline-Windows-Setup.exe' --pattern 'channel-windows.json' --pattern 'launcher-ui-*.pck'
          if($LASTEXITCODE -ne 0){throw 'Draft download failed'}
          $expected=$env:INSTALLER_SHA256
          if($expected -notmatch '^[0-9a-f]{64}$'){throw 'Invalid pinned installer digest'}
          if((Get-FileHash "assets/LongOnline-Windows-Setup.exe" -Algorithm SHA256).Hash.ToLower() -ne $expected){throw 'Installer hash mismatch'}
          # The launcher verifies the channel signature; this only selects files.
          $e=Get-Content assets/channel-windows.json -Raw | ConvertFrom-Json
          $c=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($e.payload)) | ConvertFrom-Json
          if($c.version -ne $v -or $c.platform -ne 'windows'){throw 'Channel mismatch'}
          $draft=(gh release view "v$v" --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json).assets.name
          # Chunks reused from earlier public releases are downloaded by the launcher itself.
          $patterns=@($c.game.parts | ForEach-Object {"c-$($_.sha256).bin"} | Where-Object {$draft -contains $_} | Sort-Object -Unique | ForEach-Object {'--pattern';$_})
          if($patterns.Count){gh release download "v$v" --repo $env:GITHUB_REPOSITORY --dir assets @patterns;if($LASTEXITCODE -ne 0){throw 'Chunk download failed'}}
          foreach($p in $c.game.parts){
            $f=Get-Item "assets/c-$($p.sha256).bin" -ErrorAction SilentlyContinue
            if($f -and ($f.Length -ne $p.size -or (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() -ne $p.sha256)){throw 'Chunk hash mismatch'}
          }
      - name: Install, update from channel, launch game, upgrade and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $v=$env:RELEASE_VERSION
          $setup=(Get-Item "assets/LongOnline-Windows-Setup.exe").FullName
          $install=Join-Path $env:LOCALAPPDATA 'LongOnline'
          $p=Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Installer failed'}
          if(!(Test-Path "$install/LongOnline.exe") -or !(Test-Path "$install/engine/Game.exe")){throw 'Installed binaries missing'}
          $desktop=[Environment]::GetFolderPath('Desktop')
          if(!(Test-Path "$desktop/龍群俠傳Online.lnk")){throw 'Desktop shortcut missing'}
          $state=Join-Path $env:RUNNER_TEMP 'longonline-qa-state'
          $env:GULONG_LAUNCHER_QA_DIR=$state
          $env:GULONG_LAUNCHER_QA_CHANNEL=(Get-Item assets/channel-windows.json).FullName
          $staging=Join-Path $state 'game/windows/staging'
          New-Item -ItemType Directory -Force $staging | Out-Null
          $settings=Join-Path $env:APPDATA "Godot/app_userdata/龍群俠傳Online/runner-qa-settings.cfg"
          New-Item -ItemType Directory -Force (Split-Path $settings) | Out-Null
          Set-Content $settings "volume=37"
          $e=Get-Content assets/channel-windows.json -Raw | ConvertFrom-Json
          $c=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($e.payload)) | ConvertFrom-Json
          $g=$c.game
          # Draft attachments need GitHub authorization, so seed them locally.
          Get-ChildItem assets -Filter 'c-*.bin' | Move-Item -Destination $staging
          $ui=Get-Item "assets/launcher-ui-$($c.launcher_ui.sha256).pck" -ErrorAction SilentlyContinue
          if($ui){New-Item -ItemType Directory -Force "$state/launcher-ui" | Out-Null;Copy-Item $ui "$state/launcher-ui/$($c.launcher_ui.sha256).pck"}
          $p=Start-Process "$install/LongOnline.exe" -ArgumentList '--headless' -RedirectStandardOutput launcher.log -RedirectStandardError launcher-error.log -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Launcher failed'}
          $out=Get-Content launcher.log -Raw
          if($out -notmatch "LAUNCHER_READY $($g.sha256)"){throw 'Launcher did not assemble the channel PCK'}
          if($out -notmatch "LAUNCHER_UI $([regex]::Escape($v))"){throw 'Launcher did not mount the signed UI pack'}
          $pack=Join-Path $state 'game/windows/game.pck'
          if((Get-FileHash $pack -Algorithm SHA256).Hash.ToLower() -ne $g.sha256){throw 'Final PCK differs'}
          $env:LONG_SAVE_DISABLED='1'
          $p=Start-Process "$install/engine/Game.exe" -ArgumentList @('--headless','--path',"`"$install/engine`"",'--main-pack',"`"$pack`"",'--quit-after','5') -RedirectStandardOutput game.log -RedirectStandardError game-error.log -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Native game startup failed'}
          if((Get-Content game-error.log -Raw) -match 'SCRIPT ERROR:|Parse Error:|Failed loading resource|Error loading extension'){throw 'Native game resource failure'}
          $env:GULONG_LAUNCHER_VERIFY_ONLY='0'
          $env:GULONG_LAUNCHER_QA_START_GAME='1'
          $p=Start-Process "$install/LongOnline.exe" -ArgumentList '--headless' -RedirectStandardOutput launcher-spawn.log -RedirectStandardError launcher-spawn-error.log -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Launcher spawn failed'}
          $spawn=Get-Content launcher-spawn.log -Raw
          if($spawn -notmatch 'LAUNCHER_GAME_PID (\d+)'){throw 'Launcher did not start installed game'}
          $gamePid=[int]$Matches[1]
          if(Get-Process -Id $gamePid -ErrorAction SilentlyContinue){Wait-Process -Id $gamePid -Timeout 60}
          $gameLog=Join-Path $state 'game/windows/launcher-game-qa.log'
          Copy-Item $gameLog launcher-game-qa.log
          $content=Get-Content $gameLog -Raw
          if($content -notmatch 'Godot Engine v4.7.2' -or $content -match 'SCRIPT ERROR:|Parse Error:|Failed loading resource|Error loading extension'){throw 'Launcher-started game failed'}
          $p=Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0 -or !(Test-Path $pack)){throw 'Upgrade failed or removed cache'}
          $p=Start-Process "$install/Uninstall.exe" -ArgumentList @('/S',('_?='+$install)) -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Uninstall failed'}
          Start-Sleep -Seconds 2
          if(Test-Path "$install/LongOnline.exe"){throw 'Launcher not removed'}
          if(Test-Path "$install/engine/Game.exe"){throw 'Engine not removed'}
          if(!(Test-Path $pack)){throw 'Uninstall removed player cache'}
          if(!(Test-Path $settings) -or (Get-Content $settings -Raw).Trim() -ne 'volume=37'){throw 'Uninstall changed player settings'}
          $result=@{windows=@{passed=$true;environment='GitHub Actions windows-latest';installer_sha256=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower();tests=@('native_install','shortcut','signed_channel','launcher_ui_pack','first_assembly_from_verified_chunks','headless_game_startup','installed_launcher_starts_game','overwrite_upgrade','uninstall_preserves_cache','uninstall_preserves_settings')}}
          $result | ConvertTo-Json -Depth 5 | Set-Content windows-qa.json -Encoding utf8
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-qa-${{ inputs.version }}
          path: |
            *.log
            windows-qa.json
